<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="src/styles.css">
  <title>JSON Lens — Local JSON Formatter &amp; Viewer</title>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <img src="icons/icon16.png" alt="" width="16" height="16">
      <span class="brand-name">JSON Lens</span>
      <span class="brand-sub">The JSON formatter that never phones home.</span>
    </div>
    <div class="toolbar-actions">
      <button id="btn-sample" class="btn" title="Load a sample document">Sample</button>
      <button id="btn-paste" class="btn" title="Read JSON from clipboard">Paste</button>
      <label class="btn file-btn" title="Open a .json file">Upload
        <input type="file" id="file-input" accept=".json,application/json,text/plain" hidden>
      </label>
      <button id="btn-clear" class="btn" title="Clear everything">Clear</button>
    </div>
  </header>

  <main class="layout">
    <section class="pane input-pane">
      <div class="pane-head">
        <span>Input</span>
        <span id="input-stats" class="stats"></span>
      </div>
      <textarea id="input" spellcheck="false" placeholder='Paste JSON here, or use Sample / Paste / Upload above…'></textarea>
      <div id="error-box" class="error-box hidden"></div>
    </section>

    <section class="pane output-pane">
      <div class="pane-head">
        <div class="view-tabs">
          <button id="tab-tree" class="tab active">Tree</button>
          <button id="tab-text" class="tab">Text</button>
        </div>
        <div class="output-tools">
          <input type="search" id="search" placeholder="Search…" autocomplete="off">
          <span id="search-count" class="stats"></span>
          <button id="search-prev" class="btn small" title="Previous match">↑</button>
          <button id="search-next" class="btn small" title="Next match">↓</button>
          <button id="btn-copy-pretty" class="btn small" title="Copy formatted JSON">Copy&nbsp;formatted</button>
          <button id="btn-copy-min" class="btn small" title="Copy minified JSON">Copy&nbsp;minified</button>
          <button id="btn-expand-all" class="btn small tree-only" title="Expand all">Expand</button>
          <button id="btn-collapse-all" class="btn small tree-only" title="Collapse all">Collapse</button>
        </div>
      </div>
      <div id="tree-output" class="output tree"></div>
      <pre id="text-output" class="output text hidden"><code id="text-code"></code></pre>
      <div id="empty-state" class="empty-state">
        <p>Nothing to show yet.</p>
        <p class="muted">Your JSON never leaves this tab — everything runs locally in your browser.</p>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status-valid" class="status">—</span>
    <span id="status-size" class="status muted"></span>
    <span class="status muted right">100% local · no network requests</span>
  </footer>

  <script src="src/app.js"></script>
</body>
</html>
